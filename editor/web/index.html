<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XaliCrates Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"><p class="loading">Loading XaliCrates editor…</p></div>
  <noscript>This editor requires JavaScript.</noscript>
  <script type="module">
    import { boot } from './src/app.js'
    boot().catch((error) => {
      document.getElementById('app').textContent = `Could not start the editor: ${error.message}`
    })
  </script>
</body>
</html>
