# Default virtual crates hub menu opened by /crates (or a multi-crate).
# Customize freely in XaliMenu or the XaliMenu web editor!
title = "&8Crates &7({page}/{pages})"
size = 45
register = false
refresh = 5s
args = ["multi"]
layout = ["#########", "#xxxxxxx#", "#xxxxxxx#", "#xxxxxxx#", "#########"]
legend { "#" = border }
pages {
  catalog { type = "xalicrates:crates", multi-crate = "{multi}" }
  layout = ["#########", "#xxxxxxx#", "#xxxxxxx#", "#xxxxxxx#", "#########"]
  cell = "x"
  item {
    material = "{material}"
    name = "%xalicrates_crate_name_{id}%"
    lore = [
      "&7Virtual Keys: &d{keys} &8(Physical: {physical_keys})",
      "&7Rewards: &f{reward_count}",
      "",
      "&aLeft-click &7to preview rewards",
      "&eRight-click &7to open crate",
      "&6Shift-right-click &7to open without animation",
    ]
    update = true
    click.left.actions = [{ type = "xalicrates:preview", crate = "{id}" }]
    click.right.actions = [{ type = "xalicrates:open", crate = "{id}", virtual = true }]
    click.shift-right.actions = [{ type = "xalicrates:open", crate = "{id}", virtual = true, skip-animation = true }]
  }
  empty {
    material = "barrier"
    name = "&cNo crates available"
  }
}
items {
  border { material = "gray_stained_glass_pane", name = " " }
  keys {
    material = "tripwire_hook"
    slot = 38
    name = "&eYour Virtual Keys"
    lore = ["&7Total: &d%xalicrates_virtual_keys_total%", "", "&eClick to manage keys"]
    click.any.actions = [{ type = "open", menu = "crates-keys" }]
  }
  history {
    material = "book"
    slot = 42
    name = "&bOpening History"
    lore = ["&7View your recent crate wins"]
    click.any.actions = [{ type = "open", menu = "crates-history" }]
  }
  close { material = "barrier", slot = 40, name = "&cClose", click.any.actions = [{ type = "close" }] }
}
