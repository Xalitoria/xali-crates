# Default reward preview menu opened when left-clicking a crate or running /rewards <crate>.
title = "&8Rewards: &d%xalicrates_crate_name_{crate}% &7({page}/{pages})"
size = 54
register = false
args = ["crate"]
layout = ["#########", "#xxxxxxx#", "#xxxxxxx#", "#xxxxxxx#", "#xxxxxxx#", "#########"]
legend { "#" = border }
pages {
  catalog { type = "xalicrates:rewards", crate = "{crate}" }
  layout = ["#########", "#xxxxxxx#", "#xxxxxxx#", "#xxxxxxx#", "#xxxxxxx#", "#########"]
  cell = "x"
  item {
    material = "{material}"
    name = "%xalicrates_reward_name_{crate}_{id}%"
    lore = [
      "&7Rarity: &d{rarity}",
      "&7Chance: &e{chance}%",
    ]
  }
  empty {
    material = "barrier"
    name = "&cNo rewards configured"
  }
}
items {
  border { material = "gray_stained_glass_pane", name = " " }
  prev {
    material = "arrow"
    slot = 45
    name = "&aPrevious page"
    view.require = [{ condition { type = "compare", left = "{page}", op = "GT", right = "1" } }]
    click.any.actions = [{ type = "page", by = -1 }]
  }
  next {
    material = "arrow"
    slot = 53
    name = "&aNext page"
    view.require = [{ condition { type = "compare", left = "{page}", op = "LT", right = "{pages}" } }]
    click.any.actions = [{ type = "page", by = 1 }]
  }
  back { material = "arrow", slot = 48, name = "&eBack to Crates", click.any.actions = [{ type = "open", menu = "crates" }] }
  close { material = "barrier", slot = 50, name = "&cClose", click.any.actions = [{ type = "close" }] }
}
