# Default crate opening history menu.
title = "&8Crate History &7({page}/{pages})"
size = 45
register = false
layout = ["#########", "#xxxxxxx#", "#xxxxxxx#", "#xxxxxxx#", "#########"]
legend { "#" = border }
pages {
  catalog { type = "xalicrates:history", limit = 28 }
  layout = ["#########", "#xxxxxxx#", "#xxxxxxx#", "#xxxxxxx#", "#########"]
  cell = "x"
  item {
    material = "{material}"
    name = "&d{crate}"
    lore = [
      "&7Rewards: &f{rewards}",
      "&7Opened: &f{time}",
    ]
  }
  empty {
    material = "paper"
    name = "&7No openings recorded yet"
  }
}
items {
  border { material = "gray_stained_glass_pane", name = " " }
  back { material = "arrow", slot = 39, name = "&eBack to Crates", click.any.actions = [{ type = "open", menu = "crates" }] }
  close { material = "barrier", slot = 41, name = "&cClose", click.any.actions = [{ type = "close" }] }
}
