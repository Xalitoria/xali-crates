# Default virtual keys menu opened by /keys.
title = "&8Virtual Keys &7({page}/{pages})"
size = 45
register = false
refresh = 5s
layout = ["#########", "#xxxxxxx#", "#xxxxxxx#", "#xxxxxxx#", "#########"]
legend { "#" = border }
pages {
  catalog { type = "xalicrates:keys" }
  layout = ["#########", "#xxxxxxx#", "#xxxxxxx#", "#xxxxxxx#", "#########"]
  cell = "x"
  item {
    material = "{material}"
    name = "%xalicrates_crate_name_{id}%"
    lore = [
      "&7Virtual Keys: &d{keys}",
      "&7Physical Keys: &f{physical_keys}",
      "&7Virtual Crates: &f{crates}",
      "",
      "&aLeft-click &7to withdraw 1 physical key",
      "&eRight-click &7to deposit 1 physical key",
    ]
    update = true
    click.left.actions = [{ type = "xalicrates:claim-key", crate = "{id}", amount = 1 }]
    click.right.actions = [{ type = "xalicrates:deposit-key", crate = "{id}", amount = 1 }]
  }
  empty {
    material = "barrier"
    name = "&cNo keys"
  }
}
items {
  border { material = "gray_stained_glass_pane", name = " " }
  back { material = "arrow", slot = 39, name = "&eBack to Crates", click.any.actions = [{ type = "open", menu = "crates" }] }
  close { material = "barrier", slot = 41, name = "&cClose", click.any.actions = [{ type = "close" }] }
}
